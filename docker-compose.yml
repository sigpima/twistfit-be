services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twistfit
      POSTGRES_PASSWORD: twistfit
      POSTGRES_DB: twistfit_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twistfit-dev
      MINIO_ROOT_PASSWORD: twistfit-dev-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - db
      - minio
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
